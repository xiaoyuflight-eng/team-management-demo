<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="团队管理与积分管理交互 Demo" />
    <title>团队管理 · 交互 Demo</title>
    <link rel="stylesheet" href="./styles.css?v=20260916-15" />
  </head>
  <body>
    <aside class="sidebar" aria-label="主导航">
      <a class="sidebar-product" href="#" aria-label="产品首页">
        <span class="sidebar-product-clip"><img src="./assets/sidebar/product.svg" alt="" /></span>
      </a>
      <nav class="side-nav" aria-label="业务导航">
        <button class="side-item" data-tooltip="灵感" aria-label="灵感">
          <span class="side-item-surface"><span class="side-icon-frame"><img class="side-icon" src="./assets/sidebar/sparkle.svg" alt="" /></span></span>
        </button>
        <button class="side-item" data-tooltip="生成" aria-label="生成">
          <span class="side-item-surface"><span class="side-icon-frame"><img class="side-icon" src="./assets/sidebar/video.svg" alt="" /></span></span>
        </button>
        <button class="side-item" data-tooltip="任务" aria-label="任务">
          <span class="side-item-surface"><span class="side-icon-frame"><img class="side-icon" src="./assets/sidebar/tasks.svg" alt="" /></span></span>
        </button>
        <div class="side-nav-secondary">
          <button class="side-item" data-tooltip="资产" aria-label="资产">
            <span class="side-item-surface"><span class="side-icon-frame"><img class="side-icon side-icon-folder" src="./assets/sidebar/folder.svg" alt="" /></span></span>
          </button>
          <button class="side-item" data-tooltip="画布" aria-label="画布">
            <span class="side-item-surface"><span class="side-icon-frame"><img class="side-icon side-icon-canvas" src="./assets/sidebar/canvas.svg" alt="" /></span></span>
          </button>
          <button class="side-item" data-tooltip="更多" aria-label="更多">
            <span class="side-item-surface"><span class="side-icon-frame"><img class="side-icon side-icon-more" src="./assets/sidebar/more.svg" alt="" /></span></span>
          </button>
        </div>
      </nav>

      <div class="side-bottom">
        <button class="side-bottom-button" data-tooltip="通知" aria-label="通知">
          <span class="side-icon-frame"><img class="side-icon side-icon-notifications" src="./assets/sidebar/notifications.svg" alt="" /></span>
        </button>
        <span class="side-bottom-divider" aria-hidden="true"></span>
        <button class="profile-button" aria-label="个人中心"><span class="profile-dot">T</span></button>
      </div>
    </aside>

    <header class="topbar">
      <div class="simulation-switch" role="group" aria-label="模拟工具">
        <span class="simulation-switch-label">模拟</span>
        <button type="button" class="simulation-option is-active" data-simulation-mode="all" aria-pressed="true">全积分</button>
        <button type="button" class="simulation-option" data-simulation-mode="general" aria-pressed="false">仅通用</button>
        <span class="simulation-divider" aria-hidden="true"></span>
        <button type="button" class="simulation-option simulation-cycle" data-action="new-cycle">新周期发放</button>
      </div>
      <button class="credit-pill" data-action="buy">
        <span class="credit-gem" aria-hidden="true">✦</span>
        <span id="headerCredit">7,698</span>
        <span class="credit-divider"></span>
        <span>团队会员</span>
        <span class="discount-tag">低至5折</span>
      </button>
    </header>

    <main class="page-shell" id="teamManagementView">
      <section class="team-heading" aria-labelledby="teamTitle">
        <div class="team-identity">
          <span class="team-avatar" aria-hidden="true">T</span>
          <div>
            <div class="team-name-row">
              <h1 id="teamTitle">Team-12be3d2</h1>
              <button class="icon-button edit-button" data-action="rename" aria-label="修改团队名称">⌕</button>
              <span class="team-plan" title="会员有效期：2026-10-08">高级团队会员 <span class="status-tag">生效中</span></span>
              <button class="link-button" data-action="renew">续费</button>
            </div>
            <p>团队 ID：7682691865522607422 <button class="copy-button" data-copy="7682691865522607422">复制</button></p>
          </div>
        </div>
        <button class="secondary-button" data-action="orders">订单管理</button>
      </section>

      <section class="summary-grid" aria-label="团队概览">
        <article class="summary-card credits-card">
          <div class="credit-summary-actions"><button class="link-button" data-action="details">明细</button><button class="link-button" data-action="buy">购买</button></div>
          <div class="credit-summary-flow">
            <section class="credit-summary-metric" aria-label="剩余总积分">
              <div class="card-label">剩余总积分</div>
              <div class="large-number" id="availableTotal">0</div>
            </section>
            <div class="credit-allocation-bridge">
              <div class="credit-donut" id="allocationDonut" role="img" aria-label="剩余总积分中的待分配积分占比"></div>
              <div class="credit-flow-arrow" aria-hidden="true"></div>
            </div>
            <section class="credit-summary-metric credit-unallocated-metric" aria-label="待分配积分">
              <div class="card-label">待分配积分</div>
              <div class="large-number" id="unallocatedSummaryTotal">0</div>
            </section>
          </div>
        </article>

        <article class="summary-card seats-card">
          <div class="summary-topline">
            <div>
              <div class="card-label">席位数</div>
              <div class="seat-number"><span id="seatUsed">2</span><small>/<span id="seatTotal">3</span></small></div>
            </div>
            <button class="link-button" data-action="seats">增加席位</button>
          </div>
        </article>
      </section>

      <section class="workspace" aria-label="团队管理工作区">
        <div class="toolbar">
          <div class="tabs" role="tablist" aria-label="团队管理分类">
            <button class="tab is-active" id="tab-members" role="tab" aria-selected="true" aria-controls="panel-members" data-tab="members">成员管理</button>
            <button class="tab" id="tab-credits" role="tab" aria-selected="false" aria-controls="panel-credits" data-tab="credits">积分管理</button>
            <button class="tab" id="tab-invites" role="tab" aria-selected="false" aria-controls="panel-invites" data-tab="invites">团队审批</button>
          </div>
          <div class="toolbar-actions">
            <button class="primary-button invite-button" data-action="invite">邀请成员</button>
          </div>
        </div>

        <section class="tab-panel is-active" id="panel-members" role="tabpanel" aria-labelledby="tab-members">
          <div class="table-card">
            <div class="data-table member-table table-head">
              <div>用户</div>
              <div>团队角色</div>
              <div>已消耗</div>
              <div>剩余积分</div>
              <div>加入时间</div>
              <div>操作 <span class="info-dot" title="创建者不可删除">i</span></div>
            </div>
            <div id="memberRows"></div>
          </div>
          <div class="pagination" aria-label="分页">
            <button disabled aria-label="上一页">‹</button>
            <button class="current" aria-current="page">1</button>
            <button disabled aria-label="下一页">›</button>
          </div>
        </section>

        <section class="tab-panel" id="panel-credits" role="tabpanel" aria-labelledby="tab-credits" hidden>
          <div class="credit-workspace-toolbar">
            <div class="credit-subtabs" id="creditTypeTabs" role="tablist" aria-label="积分类型"></div>
          </div>
          <section id="creditTypeContent" role="tabpanel" aria-labelledby="credit-tab-general">
          <div class="points-overview" id="pointsOverview" aria-live="polite"></div>
          <div class="shortage-banner" id="shortageBanner" hidden></div>
          <div class="table-card points-table-card">
            <div class="data-table points-table table-head" id="pointsTableHead">
              <div>用户</div>
              <div>团队角色</div>
              <div id="creditConsumedHeader">已消耗</div>
              <div id="creditBalanceHeader">剩余通用积分</div>
              <div id="creditActionHeader">操作</div>
              <div id="creditEditOperationHeader" hidden>操作</div>
            </div>
            <div id="pointsRows"></div>
          </div>
          </section>
        </section>

        <section class="tab-panel" id="panel-invites" role="tabpanel" aria-labelledby="tab-invites" hidden>
          <div id="invitePanelContent"></div>
        </section>
      </section>
    </main>

    <main class="points-detail-page" id="pointsDetailView" hidden>
      <div class="points-detail-content">
        <header class="points-detail-header">
          <div class="points-detail-title-line">
            <h1>积分明细</h1>
            <button type="button" class="detail-scope-badge" data-action="back-team" title="返回团队管理">团队空间</button>
          </div>
          <p>查看积分余额、收支明细与消耗分析</p>
        </header>

        <section class="detail-section detail-balance-section" id="detailBalanceSection" aria-labelledby="detailBalanceTitle">
          <h2 id="detailBalanceTitle">余额明细</h2>
          <div class="detail-total-balance">
            <span>团队内可用积分</span>
            <strong id="detailAvailableTotal">21,442</strong>
          </div>
          <div class="detail-balance-grid">
            <article class="detail-balance-card">
              <h3>订阅积分</h3>
              <div class="detail-balance-row">
                <strong id="detailSubscriptionTotal">21,442</strong>
                <button type="button" class="detail-text-button" data-action="renew">升级会员</button>
              </div>
            </article>
            <article class="detail-balance-card detail-purchase-card" id="detailPurchaseCard">
              <h3>充值积分</h3>
              <div class="detail-balance-row">
                <strong id="detailRechargeTotal">0</strong>
                <button type="button" class="detail-text-button" id="detailBuyButton" data-action="buy-modal">购买积分</button>
              </div>
            </article>
            <article class="detail-balance-card">
              <h3>赠送及免费积分</h3>
              <div class="detail-balance-row">
                <strong id="detailGiftTotal">0</strong>
              </div>
            </article>
          </div>
        </section>

        <section class="detail-section detail-analysis-section" aria-labelledby="detailAnalysisTitle">
          <h2 id="detailAnalysisTitle">积分消耗分析</h2>
          <div class="detail-analysis-card">
            <div class="detail-filter-grid" aria-label="积分消耗筛选条件">
              <label class="detail-filter-field">
                <span>日期范围</span>
                <button type="button" class="detail-filter-control detail-date-control">
                  <img src="./assets/detail/calendar.svg" alt="" />
                  <span>2026/08/16 — 2026/09/16</span>
                </button>
              </label>
              <label class="detail-filter-field">
                <span>模型</span>
                <button type="button" class="detail-filter-control" aria-haspopup="listbox">
                  <span>全部模型</span>
                  <img src="./assets/detail/chevron.svg" alt="" />
                </button>
              </label>
              <label class="detail-filter-field">
                <span>项目</span>
                <button type="button" class="detail-filter-control" aria-haspopup="listbox">
                  <span>全部项目</span>
                  <img src="./assets/detail/chevron.svg" alt="" />
                </button>
              </label>
              <label class="detail-filter-field">
                <span>成员</span>
                <button type="button" class="detail-filter-control detail-member-control" aria-haspopup="listbox">
                  <span>全部成员</span>
                  <img src="./assets/detail/member.svg" alt="" />
                </button>
              </label>
              <div class="detail-filter-actions">
                <button type="button" disabled>重置筛选</button>
                <button type="button" disabled>应用筛选</button>
              </div>
            </div>

            <div class="detail-pill-tabs" role="tablist" aria-label="消耗分析维度">
              <button type="button" class="is-active" role="tab" aria-selected="true" data-detail-analysis-tab="model">模型</button>
              <button type="button" role="tab" aria-selected="false" data-detail-analysis-tab="project">项目</button>
            </div>

            <div class="detail-analysis-panel">
              <article class="detail-metric-card">
                <div>
                  <span>总消耗积分</span>
                  <strong id="detailConsumedTotal">0</strong>
                </div>
                <div class="detail-metric-footer"><span>消耗记录数</span><span id="detailConsumedCount">0</span></div>
              </article>
              <article class="detail-ranking-card">
                <h3 id="detailRankingTitle">模型消耗排行</h3>
                <div class="detail-ranking-list" id="detailRankingList"></div>
              </article>
            </div>
          </div>
        </section>

        <section class="detail-section detail-ledger-section" aria-labelledby="detailLedgerTitle">
          <h2 id="detailLedgerTitle">积分明细</h2>
          <div class="detail-pill-tabs" role="tablist" aria-label="积分明细类型">
            <button type="button" class="is-active" role="tab" aria-selected="true" data-detail-ledger-tab="acquired">已获取</button>
            <button type="button" role="tab" aria-selected="false" data-detail-ledger-tab="consumed">已消耗</button>
          </div>
          <div class="detail-ledger-card">
            <div class="detail-ledger-table detail-ledger-head" id="detailLedgerHead">
              <div>获取时间</div><div>获取来源</div><div>成员名称</div><div>获取积分</div>
            </div>
            <div id="detailLedgerRows"></div>
          </div>
        </section>
      </div>
    </main>

    <button class="help-button" aria-label="帮助" data-action="help">?</button>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <div>
            <h2 id="modalTitle">操作</h2>
            <p id="modalSubtitle"></p>
          </div>
          <button class="modal-close" data-close-modal aria-label="关闭">×</button>
        </div>
        <form id="modalForm">
          <div id="modalBody"></div>
          <div class="modal-actions">
            <button type="button" class="secondary-button" data-close-modal>取消</button>
            <button type="submit" class="primary-button" id="modalConfirm">确认</button>
          </div>
        </form>
      </section>
    </div>

    <div class="toast-region" aria-live="polite" aria-atomic="true" id="toastRegion"></div>

    <script src="./app.js?v=20260916-15"></script>
  </body>
</html>
